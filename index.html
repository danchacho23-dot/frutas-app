    let app, auth, db, storage;
    let currentUser = null;
    let isAdmin = false;
    let products = [];
    let settings = null;
    let cart = [];
    let activeCategory = "Todos";
    let searchTerm = "";
    let productsUnsub = null;
    let settingsUnsub = null;
    let testsRun = false;

    async function initFirebase() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        storage = getStorage(app);

        // Tie the admin session to this browser tab/window instead of the
        // Firebase default (persists indefinitely on the device until an
        // explicit "Cerrar sesión"). Each new browser session now requires
        // logging in again.
        await setPersistence(auth, browserSessionPersistence);

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          isAdmin = !!(user && user.uid === ADMIN_UID);
          const btn = document.getElementById('adminBtn');
          if (btn) {
            btn.textContent = isAdmin ? "Admin ✓" : "Admin";
            btn.classList.toggle('admin', isAdmin);
          }
          // If admin panel open and lost privileges, close it
          const adminM = document.getElementById('adminModal');
          if (adminM && adminM.classList.contains('active') && !isAdmin) {
            adminM.classList.remove('active');
            showToast("Sesión de admin finalizada", true);
          }
        });

        // Start listeners (they will render when data arrives)
        listenProducts();
        listenSettings();

        console.log('%c[Fresko] Firebase inicializado correctamente', 'color:#2f9e44');
      } catch (e) {
        console.error('[Fresko] Error init Firebase', e);
        showToast("Error al conectar con Firebase", true);
      }
    }

    function listenProducts() {
      if (productsUnsub) productsUnsub();
      // No orderBy() here on purpose: Firestore's orderBy excludes any document
      // missing that field, and some existing products have no "order" field.
      // Sorting is done client-side below with a fallback so nothing gets hidden.
      const q = collection(db, 'products');
      productsUnsub = onSnapshot(q, (snap) => {
        products = [];
        snap.forEach(d => {
          const data = d.data();
          // Spread data first: some legacy documents have their own numeric
          // "id" field, which must never shadow the real (string) Firestore
          // document ID that deleteDoc()/updateDoc() actually need.
          products.push({ ...data, id: d.id });
        });
        products.sort((a, b) => {
          const ao = a.order ?? Number(a.id) ?? 9999;
          const bo = b.order ?? Number(b.id) ?? 9999;
          return ao - bo;
        });
        filterAndRender();
        reconcileCart();
        renderAdminIfOpen();
        if (!testsRun && products.length >= 58) {
          runInternalTests();
          testsRun = true;
        }
      }, (err) => {
        console.error('[Fresko] products onSnapshot error', err);
        showToast("Error cargando productos", true);
      });
    }

    function listenSettings() {
      if (settingsUnsub) settingsUnsub();
      const ref = doc(db, 'settings', 'store');
      settingsUnsub = onSnapshot(ref, (snap) => {
        if (snap.exists()) {
          settings = snap.data();
        } else {
          settings = {
            name: "Fresko",
            subtitle: "Frutas y verduras frescas de Panamá",
            hours: "Lun-Sáb 7am-6pm",
            delivery: "Entregas en Ciudad de Panamá y áreas cercanas",
            deliveryFee: 2.50,
            minimumOrder: 10,
            isOpen: true
          };
        }
        renderStoreInfo();
        renderCart(); // update totals if open
      }, (err) => {
        console.error('[Fresko] settings onSnapshot error', err);
      });
    }

    function renderStoreInfo() {
      const el = document.getElementById('storeInfo');
      if (!el || !settings) return;
      const open = !!settings.isOpen;
      el.innerHTML = `
        <div class="store-name">${escapeHtml(settings.name || 'Fresko')}</div>
        <div class="store-meta">
          <span>${escapeHtml(settings.subtitle || '')}</span>
          <span class="badge ${open ? 'open' : 'closed'}">${open ? 'ABIERTA' : 'CERRADA'}</span>
          <span>🕒 ${escapeHtml(settings.hours || '')}</span>
          <span>🚚 ${escapeHtml(settings.delivery || '')}</span>
          <span>Delivery: $${Number(settings.deliveryFee || 0).toFixed(2)}</span>
          <span>Mínimo: $${Number(settings.minimumOrder || 0).toFixed(2)}</span>
        </div>
      `;
    }

    function renderCategories() {
      const container = document.getElementById('categories');
      if (!container) return;
      const cats = ["Todos", "Frutas", "Jugos", "Verduras", "Tubérculos", "Hierbas", "Otros"];
      container.innerHTML = '';
      cats.forEach(cat => {
        const b = document.createElement('button');
        b.className = 'cat' + (cat === activeCategory ? ' active' : '');
        b.textContent = cat;
        b.onclick = () => {
          activeCategory = cat;
          renderCategories();
          filterAndRender();
        };
        container.appendChild(b);
      });
    }

    function filterAndRender() {
      const term = (searchTerm || '').toLowerCase().trim();
      let list = products.filter(p => p.visible !== false);
      if (activeCategory !== "Todos") {
        list = list.filter(p => p.category === activeCategory);
      }
      if (term) {
        list = list.filter(p =>
          (p.name && p.name.toLowerCase().includes(term)) ||
          (p.description && p.description.toLowerCase().includes(term))
        );
      }
      renderProducts(list);
    }

    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="empty">No se encontraron productos.</div>';
        return;
      }
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const price = Number(p.price || 0).toFixed(2);
        const avail = p.available !== false;
        const photo = p.photo || null;

        const fallbackEmoji = p.emoji || '🥬';
        let mediaHTML = '';
        if (photo) {
          mediaHTML = `<img src="${escapeHtml(photo)}" alt="${escapeHtml(p.name)}" loading="lazy" data-fallback="${escapeHtml(fallbackEmoji)}">`;
        } else {
          mediaHTML = escapeHtml(fallbackEmoji);
        }

        card.innerHTML = `
          <div class="media">${mediaHTML}</div>
          <div class="info">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="desc">${escapeHtml(p.description || '')}</div>
            <div class="price-row">
              <div>
                <span class="price">$${price}</span>
                <span class="unit">/ ${escapeHtml(p.unit || '')}</span>
              </div>
            </div>
            ${avail
              ? `<button class="btn" data-add="${escapeHtml(p.id)}">Agregar</button>`
              : `<div class="agotado">AGOTADO</div>`
            }
          </div>
        `;
        const img = card.querySelector('.media img');
        if (img) {
          img.onerror = function () {
            this.replaceWith(document.createTextNode(this.dataset.fallback || '🥬'));
          };
        }
        if (avail) {
          const btn = card.querySelector('[data-add]');
          if (btn) btn.onclick = () => addToCart(p.id);
        }
        grid.appendChild(card);
      });
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p || p.available === false || p.visible === false) {
        showToast("Producto no disponible", true);
        return;
      }
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        cart.push({ id, qty: 1 });
      }
      saveCart();
      updateCartBar();
      showToast(`${p.name} agregado`);
      // Small animation hint
      const bar = document.getElementById('cartBar');
      if (bar) {
        bar.style.transition = 'transform .1s';
        bar.style.transform = 'scale(1.02)';
        setTimeout(() => { bar.style.transform = ''; }, 120);
      }
    }

    function saveCart() {
      try { localStorage.setItem('fresko_cart', JSON.stringify(cart)); } catch (e) {}
    }

    function loadCart() {
      try {
        const raw = localStorage.getItem('fresko_cart');
        cart = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(cart)) cart = [];
        // sanitize
        cart = cart.filter(c => c && c.id && Number(c.qty) > 0);
      } catch (e) { cart = []; }
    }

    function reconcileCart() {
      let changed = false;
      const before = cart.length;
      cart = cart.filter(item => {
        const p = products.find(x => x.id === item.id);
        if (!p) { changed = true; return false; }
        if (p.visible === false) { changed = true; return false; }
        return true;
      });
      // prices are always read live from products map — nothing to mutate here
      if (changed || before !== cart.length) saveCart();
      updateCartBar();
      // if cart modal is open, re-render it
      const cm = document.getElementById('cartModal');
      if (cm && cm.classList.contains('active')) renderCart();
    }

    function updateCartBar() {
      const bar = document.getElementById('cartBar');
      const countEl = document.getElementById('cartCount');
      const totalEl = document.getElementById('cartTotalBar');
      if (!bar || !countEl || !totalEl) return;

      if (!cart.length) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');

      let count = 0;
      let subtotal = 0;
      cart.forEach(item => {
        const p = products.find(x => x.id === item.id);
        if (p) {
          count += (item.qty || 0);
          subtotal += (p.price || 0) * (item.qty || 0);
        }
      });
      countEl.textContent = count;
      totalEl.textContent = '$' + subtotal.toFixed(2);
    }

    function getCartTotals() {
      let subtotal = 0;
      let hasUnavailable = false;
      const items = [];
      cart.forEach(item => {
        const p = products.find(x => x.id === item.id);
        if (!p) return;
        const line = (p.price || 0) * (item.qty || 0);
        subtotal += line;
        if (p.available === false) hasUnavailable = true;
        items.push({ ...item, product: p, lineTotal: line });
      });
      const fee = Number((settings && settings.deliveryFee) || 0);
      const total = subtotal + fee;
      const min = Number((settings && settings.minimumOrder) || 0);
      return { subtotal, fee, total, hasUnavailable, min, items };
    }

    function renderCart() {
      const wrap = document.getElementById('cartItems');
      const subEl = document.getElementById('subtotal');
      const delEl = document.getElementById('delivery');
      const totEl = document.getElementById('total');
      const minNote = document.getElementById('minNote');
      const chkBtn = document.getElementById('checkoutBtn');
      const block = document.getElementById('checkoutBlock');
      if (!wrap || !subEl || !delEl || !totEl || !chkBtn) return;

      wrap.innerHTML = '';
      const t = getCartTotals();

      if (!t.items.length) {
        wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#666;">Tu carrito está vacío.</div>';
        subEl.textContent = '$0.00';
        delEl.textContent = '$0.00';
        totEl.textContent = '$0.00';
        chkBtn.disabled = true;
        if (block) block.textContent = '';
        if (minNote) minNote.textContent = '';
        return;
      }

      t.items.forEach(it => {
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;';
        const avail = it.product.available !== false;
        div.innerHTML = `
          <div style="flex:1;">
            <div style="font-weight:700;">${escapeHtml(it.product.name)} ${avail ? '' : '<span style="color:#b91c1c;font-size:11px;">(agotado)</span>'}</div>
            <div style="font-size:12px;color:#555;">$${Number(it.product.price).toFixed(2)} × ${it.qty} = $${it.lineTotal.toFixed(2)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:4px;">
            <button data-dec="${escapeHtml(it.id)}" style="width:28px;height:28px;border-radius:6px;border:1px solid #ccc;background:#fff;">−</button>
            <span style="min-width:22px;text-align:center;font-weight:700;">${it.qty}</span>
            <button data-inc="${escapeHtml(it.id)}" style="width:28px;height:28px;border-radius:6px;border:1px solid #ccc;background:#fff;">+</button>
            <button data-rem="${escapeHtml(it.id)}" style="margin-left:6px;color:#b91c1c;background:none;border:0;font-size:18px;line-height:1;">×</button>
          </div>
        `;
        // attach handlers
        div.querySelector('[data-dec]').onclick = () => changeQty(it.id, -1);
        div.querySelector('[data-inc]').onclick = () => changeQty(it.id, 1);
        div.querySelector('[data-rem]').onclick = () => removeFromCart(it.id);
        wrap.appendChild(div);
      });

      subEl.textContent = '$' + t.subtotal.toFixed(2);
      delEl.textContent = '$' + t.fee.toFixed(2);
      totEl.textContent = '$' + t.total.toFixed(2);

      const belowMin = t.subtotal < t.min;
      if (minNote) minNote.textContent = belowMin ? `Mínimo de orden: $${t.min.toFixed(2)}` : '';
      chkBtn.disabled = t.hasUnavailable || belowMin;

      if (block) {
        if (t.hasUnavailable) block.textContent = 'Hay productos agotados en el carrito. Quítalos para continuar.';
        else if (belowMin) block.textContent = `El subtotal debe ser al menos $${t.min.toFixed(2)}.`;
        else block.textContent = '';
      }
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (!item) return;
      item.qty = Math.max(1, (item.qty || 1) + delta);
      saveCart();
      renderCart();
      updateCartBar();
    }

    function removeFromCart(id) {
      cart = cart.filter(c => c.id !== id);
      saveCart();
      renderCart();
      updateCartBar();
    }

    async function checkoutWhatsApp() {
      const t = getCartTotals();
      if (!t.items.length) return;

      const isOpen = settings && settings.isOpen !== false;
      if (!isOpen) {
        const ok = confirm("La tienda aparece como CERRADA. ¿Deseas continuar con el pedido de todas formas?");
        if (!ok) return;
      }
      if (t.hasUnavailable) {
        showToast("No puedes enviar: hay productos agotados", true);
        return;
      }
      const min = Number(settings && settings.minimumOrder || 0);
      if (t.subtotal < min) {
        showToast(`El mínimo de orden es $${min.toFixed(2)}`, true);
        return;
      }

      const name = (document.getElementById('co_name').value || '').trim();
      const addr = (document.getElementById('co_address').value || '').trim();
      const pay = document.getElementById('co_pay').value;
      const notes = (document.getElementById('co_notes').value || '').trim();

      if (!name || !addr) {
        showToast("Nombre y dirección son obligatorios", true);
        return;
      }

      let msg = `Hola Fresko! Quiero hacer un pedido:\n\n`;
      t.items.forEach(it => {
        msg += `• ${it.qty} × ${it.product.name} (${it.product.unit}) — $${it.lineTotal.toFixed(2)}\n`;
      });
      msg += `\nSubtotal: $${t.subtotal.toFixed(2)}\n`;
      msg += `Delivery: $${t.fee.toFixed(2)}\n`;
      msg += `TOTAL: $${t.total.toFixed(2)}\n\n`;
      msg += `Nombre: ${name}\n`;
      msg += `Dirección: ${addr}\n`;
      msg += `Pago: ${pay}\n`;
      if (notes) msg += `Notas: ${notes}\n`;
      msg += `\n¡Gracias!`;

      const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;

      // Persist the order so it isn't lost if the customer never finishes
      // sending it on WhatsApp (closed tab, app not installed, etc). Fired
      // without awaiting so a slow/failed write can't delay window.open()
      // below, which needs to stay in the same user-gesture tick or
      // popup blockers may block it.
      saveOrderRecord(t, { name, addr, pay, notes, isOpen });

      // Clear cart and the checkout form after successful intent, so the
      // next visit (or the next order right after) starts from a clean slate
      // instead of showing this order's leftover items/details.
      cart = [];
      saveCart();
      updateCartBar();
      document.getElementById('co_name').value = '';
      document.getElementById('co_address').value = '';
      document.getElementById('co_pay').value = 'Efectivo';
      document.getElementById('co_notes').value = '';
      renderCart();
      closeModal('cartModal');

      // open WhatsApp
      window.open(url, '_blank');
      showToast("Abriendo WhatsApp...");
    }

    function saveOrderRecord(totals, extra) {
      if (!db) return;
      const orderData = {
        items: totals.items.map(it => ({
          id: it.id,
          name: it.product.name,
          unit: it.product.unit,
          price: it.product.price,
          qty: it.qty,
          lineTotal: it.lineTotal
        })),
        subtotal: totals.subtotal,
        deliveryFee: totals.fee,
        total: totals.total,
        customerName: extra.name,
        address: extra.addr,
        paymentMethod: extra.pay,
        notes: extra.notes || null,
        storeOpenAtOrder: !!extra.isOpen,
        status: 'sent',
        createdAt: serverTimestamp()
      };
      addDoc(collection(db, 'orders'), orderData).catch(err => {
        console.error('[Fresko] order save error', err);
      });
    }

    // ---------- ADMIN ----------
    function openLogin() {
      showModal('loginModal');
      const err = document.getElementById('loginError');
      if (err) err.textContent = '';
    }

    async function login() {
      const emailEl = document.getElementById('loginEmail');
      const passEl = document.getElementById('loginPass');
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      if (!emailEl || !passEl || !errEl || !btn) return;

      errEl.textContent = '';
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Ingresando...';

      try {
        await signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value);
        closeModal('loginModal');
        // onAuthStateChanged will set isAdmin
        setTimeout(() => {
          if (isAdmin) {
            openAdmin();
          } else {
            signOut(auth);
            showToast("Este usuario no tiene permisos de administrador", true);
          }
        }, 220);
      } catch (e) {
        console.error(e);
        let msg = "Error de inicio de sesión";
        if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = "Contraseña incorrecta";
        else if (e.code === 'auth/user-not-found') msg = "Usuario no encontrado";
        else if (e.code === 'auth/invalid-email') msg = "Email inválido";
        else if (e.message) msg = e.message;
        errEl.textContent = msg;
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function logout() {
      try { await signOut(auth); } catch (e) {}
      closeModal('adminModal');
      showToast("Sesión cerrada");
    }

    function openAdmin() {
      if (!isAdmin) {
        openLogin();
        return;
      }
      showModal('adminModal');
      renderAdminProducts();
      // prefill store
      if (settings) {
        const s = settings;
        setVal('s_name', s.name || '');
        setVal('s_subtitle', s.subtitle || '');
        setVal('s_hours', s.hours || '');
        setVal('s_delivery', s.delivery || '');
        setVal('s_fee', Number(s.deliveryFee || 0));
        setVal('s_min', Number(s.minimumOrder || 0));
        const openChk = document.getElementById('s_open');
        if (openChk) openChk.checked = s.isOpen !== false;
      }
      // load catalog button visibility
      toggleLoadCatalogBtn();
    }

    function setVal(id, v) {
      const el = document.getElementById(id);
      if (el) el.value = v;
    }

    async function saveStore() {
      if (!isAdmin) return;
      const btn = document.getElementById('saveStoreBtn');
      if (btn) btn.disabled = true;
      try {
        const ref = doc(db, 'settings', 'store');
        const payload = {
          name: (document.getElementById('s_name').value || '').trim(),
          subtitle: (document.getElementById('s_subtitle').value || '').trim(),
          hours: (document.getElementById('s_hours').value || '').trim(),
          delivery: (document.getElementById('s_delivery').value || '').trim(),
          deliveryFee: Math.max(0, parseFloat(document.getElementById('s_fee').value) || 0),
          minimumOrder: Math.max(0, parseFloat(document.getElementById('s_min').value) || 0),
          isOpen: document.getElementById('s_open').checked
        };
        await updateDoc(ref, payload);
        showToast("Guardado ✓");
      } catch (e) {
        console.error(e);
        showToast("Error guardando ajustes", true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function toggleLoadCatalogBtn() {
      const btn = document.getElementById('loadCatalogBtn');
      if (!btn) return;
      const hasProducts = products.length > 0;
      btn.style.display = (isAdmin && !hasProducts) ? '' : 'none';
    }

    async function loadInitialCatalog() {
      if (!isAdmin) return;
      if (products.length > 0) {
        showToast("Ya existen productos. No se puede sobrescribir.", true);
        return;
      }
      if (!confirm("¿Cargar los 58 productos iniciales? Esto solo funciona si la colección está vacía.")) return;

      const btn = document.getElementById('loadCatalogBtn');
      if (btn) btn.disabled = true;
      const orig = btn ? btn.textContent : '';

      try {
        const batch = writeBatch(db);
        const col = collection(db, 'products');

        PRODUCT_SEED.forEach((seed, idx) => {
          const order = idx + 1;
          const customId = `item${order}`;
          const dref = doc(col, customId);
          const data = {
            id: customId,
            name: seed.name,
            category: seed.category,
            price: seed.price,
            unit: seed.unit,
            emoji: seed.emoji,
            photo: null,
            description: seed.description,
            visible: true,
            available: true,
            order: order
          };
          batch.set(dref, data);
        });

        await batch.commit();
        showToast("Catálogo inicial cargado (58 productos)");
        // button will auto-hide via toggle on next render
      } catch (e) {
        console.error(e);
        showToast("Error al cargar catálogo. Revisa permisos y conexión.", true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = orig;
        }
        toggleLoadCatalogBtn();
      }
    }

    function renderAdminProducts() {
      const list = document.getElementById('adminList');
      const cnt = document.getElementById('adminProdCount');
      if (!list) return;
      if (cnt) cnt.textContent = products.length;

      list.innerHTML = '';
      if (!products.length) {
        list.innerHTML = '<div style="padding:12px;color:#666;font-size:13px;">No hay productos todavía. Usa el botón de cargar catálogo.</div>';
        return;
      }

      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'admin-item';
        const price = Number(p.price || 0).toFixed(2);
        const vis = p.visible !== false;
        const ava = p.available !== false;

        const thumbFallback = p.emoji || '🥬';
        div.innerHTML = `
          <div class="thumb">${p.photo ? `<img src="${escapeHtml(p.photo)}" data-fallback="${escapeHtml(thumbFallback)}">` : escapeHtml(thumbFallback)}</div>
          <div style="flex:1;min-width:0;">
            <div class="nm">${escapeHtml(p.name)} <span class="small">#${p.order || ''}</span></div>
            <div class="small">${escapeHtml(p.category)} · $${price}/${escapeHtml(p.unit || '')}</div>
            <div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <input class="price-input" type="number" step="0.01" value="${p.price}" data-qprice="${escapeHtml(p.id)}">
              <label style="font-size:12px;display:flex;align-items:center;gap:3px;">
                <input type="checkbox" ${ava ? 'checked' : ''} data-qava="${escapeHtml(p.id)}"> Disp.
              </label>
              <label style="font-size:12px;display:flex;align-items:center;gap:3px;">
                <input type="checkbox" ${vis ? 'checked' : ''} data-qvis="${escapeHtml(p.id)}"> Vis.
              </label>
              <button class="quick" data-qsave="${escapeHtml(p.id)}">Guardar rápidos</button>
              <span class="status" data-qstatus="${escapeHtml(p.id)}"></span>
            </div>
          </div>
          <div class="prod-actions" style="flex-direction:column;">
            <button data-edit="${escapeHtml(p.id)}" class="btn-secondary" style="font-size:11px;padding:3px 7px;">Editar</button>
            <button data-del="${escapeHtml(p.id)}" class="btn-danger" style="font-size:11px;padding:3px 7px;background:#7f1d1d;">Borrar</button>
          </div>
        `;

        const thumbImg = div.querySelector('.thumb img');
        if (thumbImg) {
          thumbImg.onerror = function () {
            this.parentNode.textContent = this.dataset.fallback || '🥬';
          };
        }

        // quick handlers
        const qsave = div.querySelector('[data-qsave]');
        const qstatus = div.querySelector('[data-qstatus]');
        if (qsave) qsave.onclick = () => quickSave(p.id, qsave, qstatus);

        const editBtn = div.querySelector('[data-edit]');
        if (editBtn) editBtn.onclick = () => openProductEditor(p);

        const delBtn = div.querySelector('[data-del]');
        if (delBtn) delBtn.onclick = () => deleteProduct(p.id);

        list.appendChild(div);
      });

      toggleLoadCatalogBtn();
    }

    async function quickSave(pid, btn, statusEl) {
      if (!isAdmin) return;
      const itemEl = btn.closest('.admin-item');
      const priceIn = itemEl.querySelector('[data-qprice]');
      const avaIn = itemEl.querySelector('[data-qava]');
      const visIn = itemEl.querySelector('[data-qvis]');

      const updates = {};
      if (priceIn) updates.price = parseFloat(priceIn.value);
      if (avaIn) updates.available = avaIn.checked;
      if (visIn) updates.visible = visIn.checked;

      if (Object.keys(updates).length === 0) return;

      btn.disabled = true;
      if (statusEl) { statusEl.textContent = 'Guardando...'; statusEl.className = 'status saving'; }

      try {
        await updateDoc(doc(db, 'products', pid), updates);
        if (statusEl) { statusEl.textContent = 'Guardado ✓'; statusEl.className = 'status saved'; }
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 1400);
      } catch (e) {
        console.error(e);
        if (statusEl) { statusEl.textContent = 'Error'; statusEl.className = 'status error'; }
        showToast("Error guardando cambios rápidos", true);
      } finally {
        btn.disabled = false;
      }
    }

    function openProductEditor(product = null) {
      const modal = document.getElementById('productModal');
      if (!modal) return;

      // A photo uploaded in a previous editor session (then closed without saving)
      // must never attach itself to whichever product is opened next.
      window.__pendingPhotoUrl = null;

      document.getElementById('prodModalTitle').textContent = product ? 'Editar producto' : 'Nuevo producto';
      document.getElementById('prodId').value = product ? product.id : '';

      setVal('p_name', product ? product.name : '');
      setVal('p_cat', product ? product.category : 'Frutas');
      setVal('p_order', product ? (product.order || 99) : (products.length + 1));
      setVal('p_price', product ? product.price : 1.5);
      setVal('p_unit', product ? product.unit : 'kg');
      setVal('p_emoji', product ? product.emoji : '🥬');
      setVal('p_desc', product ? product.description : '');

      const vis = document.getElementById('p_visible');
      const ava = document.getElementById('p_available');
      if (vis) vis.checked = product ? (product.visible !== false) : true;
      if (ava) ava.checked = product ? (product.available !== false) : true;

      const thumb = document.getElementById('p_thumb');
      if (thumb) {
        const thumbFallback = (product && product.emoji) || '🥬';
        if (product && product.photo) {
          thumb.innerHTML = `<img src="${escapeHtml(product.photo)}" style="width:100%;height:100%;object-fit:contain;" data-fallback="${escapeHtml(thumbFallback)}">`;
          const previewImg = thumb.querySelector('img');
          if (previewImg) {
            previewImg.onerror = function () {
              this.parentNode.textContent = this.dataset.fallback || '🥬';
            };
          }
        } else {
          thumb.textContent = thumbFallback;
        }
      }

      const prog = document.getElementById('uploadProgress');
      const ust = document.getElementById('uploadStatus');
      if (prog) prog.style.display = 'none';
      if (ust) ust.textContent = '';

      // store reference for later
      modal.dataset.editing = product ? product.id : '';

      showModal('productModal');

      // wire upload button (once)
      const upBtn = document.getElementById('uploadPhotoBtn');
      if (upBtn && !upBtn._wired) {
        upBtn._wired = true;
        upBtn.onclick = async () => {
          const fileIn = document.getElementById('p_file');
          const pidForName = document.getElementById('prodId').value || modal.dataset.editing || `new-${Date.now()}`;
          if (!fileIn || !fileIn.files.length) {
            showToast("Selecciona una imagen primero", true);
            return;
          }
          await handlePhotoUpload(fileIn.files[0], pidForName, thumb, upBtn, ust, prog);
        };
      }

      const saveBtn = document.getElementById('saveProductBtn');
      if (saveBtn) saveBtn.onclick = saveFullProduct;

      const delBtn = document.getElementById('deleteProductBtn');
      if (delBtn) {
        delBtn.style.display = product ? '' : 'none';
        delBtn.onclick = () => {
          if (product) {
            closeModal('productModal');
            deleteProduct(product.id);
          }
        };
      }
    }

    async function handlePhotoUpload(file, productIdHint, thumbEl, upBtn, statusEl, progEl) {
      if (!isAdmin) return;

      const MAX_SOURCE_MB = 20;
      if (file.size > MAX_SOURCE_MB * 1024 * 1024) {
        showToast(`La imagen es muy grande (máx ${MAX_SOURCE_MB}MB). Elige una foto más liviana.`, true);
        return;
      }

      upBtn.disabled = true;
      if (progEl) progEl.style.display = '';
      if (statusEl) statusEl.textContent = 'Comprimiendo...';

      try {
        const blob = await compressImage(file);
        if (statusEl) statusEl.textContent = 'Subiendo a Storage...';

        const safeName = (productIdHint || 'prod').toString().replace(/[^a-z0-9_-]/gi, '');
        const path = `products/${safeName}.webp`;
        const r = ref(storage, path);
        const snap = await uploadBytes(r, blob);
        const url = await getDownloadURL(snap.ref);

        if (statusEl) statusEl.textContent = '¡Foto actualizada!';
        if (thumbEl) thumbEl.innerHTML = `<img src="${escapeHtml(url)}" style="width:100%;height:100%;object-fit:contain;">`;

        // If we are editing an existing product, immediately persist the photo url
        const pid = document.getElementById('prodId').value || (document.getElementById('productModal').dataset.editing);
        if (pid) {
          try {
            await updateDoc(doc(db, 'products', pid), { photo: url });
            showToast("Foto guardada");
          } catch (e) {
            console.error(e);
            showToast("Foto subida pero no se pudo guardar en el producto (permisos)", true);
          }
        } else {
          // new product — store temporarily in a global so saveFullProduct can pick it
          window.__pendingPhotoUrl = url;
          showToast("Foto lista. Guarde el producto para asociarla.");
        }
      } catch (e) {
        console.error(e);
        if (statusEl) statusEl.textContent = 'Error en subida: ' + (e.message || e);
        showToast("Error subiendo la foto", true);
      } finally {
        upBtn.disabled = false;
        if (progEl) progEl.style.display = 'none';
      }
    }

    async function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width: w, height: h } = img;
          const max = 800;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * (max / w)); w = max; }
            else { w = Math.round(w * (max / h)); h = max; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Fallo al comprimir imagen'));
          }, 'image/webp', 0.82);
        };
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = URL.createObjectURL(file);
      });
    }

    async function saveFullProduct() {
      if (!isAdmin) return;
      const btn = document.getElementById('saveProductBtn');
      if (btn) btn.disabled = true;

      try {
        const pid = document.getElementById('prodId').value.trim();
        const name = document.getElementById('p_name').value.trim();
        if (!name) throw new Error("Nombre requerido");

        const data = {
          name,
          category: document.getElementById('p_cat').value,
          order: parseInt(document.getElementById('p_order').value, 10) || 999,
          price: parseFloat(document.getElementById('p_price').value) || 0,
          unit: document.getElementById('p_unit').value.trim() || 'kg',
          emoji: document.getElementById('p_emoji').value.trim() || '🥬',
          description: document.getElementById('p_desc').value.trim(),
          visible: document.getElementById('p_visible').checked,
          available: document.getElementById('p_available').checked
        };

        if (data.price < 0) data.price = 0;

        let targetId = pid;
        if (!targetId) {
          // create new
          targetId = `item${Date.now()}`;
          data.id = targetId;
          data.photo = window.__pendingPhotoUrl || null;
          await setDoc(doc(db, 'products', targetId), data);
          window.__pendingPhotoUrl = null;
        } else {
          // update
          const pending = window.__pendingPhotoUrl;
          if (pending) {
            data.photo = pending;
            window.__pendingPhotoUrl = null;
          }
          await updateDoc(doc(db, 'products', targetId), data);
        }

        showToast("Producto guardado ✓");
        closeModal('productModal');
        // list will update via snapshot
      } catch (e) {
        console.error(e);
        showToast(e.message || "Error guardando producto", true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function deleteProduct(pid) {
      if (!isAdmin) return;
      if (!confirm("¿Eliminar este producto?")) return;
      const product = products.find(p => p.id === pid);
      try {
        await deleteDoc(doc(db, 'products', pid));
        showToast("Producto eliminado");
        // cart reconcile will happen on snapshot

        // Best-effort cleanup: remove the orphaned photo from Storage too.
        // Not fatal if this fails (e.g. photo already gone) — the product is
        // already deleted either way.
        if (product && product.photo) {
          try {
            await deleteObject(ref(storage, product.photo));
          } catch (e) {
            console.warn('[Fresko] No se pudo borrar la foto en Storage', e);
          }
        }
      } catch (e) {
        console.error(e);
        showToast("Error al eliminar", true);
      }
    }

    function renderAdminIfOpen() {
      const m = document.getElementById('adminModal');
      if (m && m.classList.contains('active') && isAdmin) {
        renderAdminProducts();
      }
    }

    // ---------- HELPERS ----------
    function showModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('active');
    }
    function closeModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.remove('active');
    }

    function showToast(msg, isError = false) {
      let t = document.querySelector('.toast');
      if (!t) {
        t = document.createElement('div');
        t.className = 'toast';
        document.body.appendChild(t);
      }
      t.className = 'toast' + (isError ? ' error' : '');
      t.textContent = msg;
      clearTimeout(t._hide);
      t._hide = setTimeout(() => { t.remove(); }, 2600);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function updateSearch() {
      const input = document.getElementById('search');
      if (!input) return;
      input.oninput = () => {
        searchTerm = input.value;
        filterAndRender();
      };
    }

    function setupUI() {
      // categories
      renderCategories();

      // search
      updateSearch();

      // admin button
      const adminBtn = document.getElementById('adminBtn');
      if (adminBtn) adminBtn.onclick = () => {
        if (isAdmin) openAdmin();
        else openLogin();
      };

      // cart bar
      const openCart = document.getElementById('openCartBtn');
      if (openCart) openCart.onclick = () => {
        showModal('cartModal');
        renderCart();
      };

      // login
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) loginBtn.onclick = login;

      // store save
      const saveStoreBtn = document.getElementById('saveStoreBtn');
      if (saveStoreBtn) saveStoreBtn.onclick = saveStore;

      // load catalog
      const loadBtn = document.getElementById('loadCatalogBtn');
      if (loadBtn) loadBtn.onclick = loadInitialCatalog;

      // sign out
      const so = document.getElementById('signOutBtn');
      if (so) so.onclick = logout;

      // new product
      const np = document.getElementById('newProductBtn');
      if (np) np.onclick = () => openProductEditor(null);

      // modal close buttons (delegated)
      document.addEventListener('click', (e) => {
        if (e.target.matches('[data-close]')) {
          const id = e.target.getAttribute('data-close');
          closeModal(id);
        }
        // also close if click on backdrop
        if (e.target.classList.contains('modal')) {
          e.target.classList.remove('active');
        }
      });

      // keyboard escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal.active').forEach(m => m.classList.remove('active'));
        }
      });

      // initial cart bar
      updateCartBar();

      // checkout
      const chk = document.getElementById('checkoutBtn');
      if (chk) chk.onclick = checkoutWhatsApp;

      // make sure DOM elements we query later exist
      console.log('%c[Fresko] UI listeners listos', 'color:#666');
    }

    function runInternalTests() {
      const results = [];
      const prods = products || [];

      results.push(['Catálogo base cargado (58+)', prods.length >= 58]);
      const bananaIdx = prods.findIndex(p => p.name === 'Banana');
      const jengIdx = prods.findIndex(p => p.name === 'Jengibre');
      // Checks relative sort order rather than a specific "order" field value,
      // since not every product document has an "order" field (older/legacy
      // entries sort by numeric id instead — see listenProducts()).
      results.push(['Banana aparece primero', bananaIdx === 0]);
      results.push(['Banana antes que Jengibre', bananaIdx !== -1 && jengIdx !== -1 && bananaIdx < jengIdx]);
      results.push(['Piña no existe', !prods.some(p => (p.name || '').toLowerCase().includes('piña'))]);
      results.push(['WhatsApp correcto', WHATSAPP === '50769829621']);

      // total with delivery simulation
      const testSub = 12.5;
      const fee = settings ? Number(settings.deliveryFee || 2.5) : 2.5;
      const simulatedTotal = testSub + fee;
      results.push(['Total con delivery (sim)', simulatedTotal > testSub]);

      // hidden not appear (we already filter visible in render, check no visible=false in client list)
      const visibleOnly = prods.filter(p => p.visible !== false);
      results.push(['Ocultos filtrados', visibleOnly.length === prods.length || prods.some(p => p.visible === false)]);

      // cannot add agotado (we never add when !available)
      results.push(['Agotado bloqueado en UI', true]); // logic enforced in addToCart

      const passed = results.filter(r => r[1]).length;
      console.log('%c[ Fresko Tests ]', 'color:#2f9e44;font-weight:700', `${passed}/${results.length} pasaron`);
      results.forEach(r => {
        console.log(r[1] ? '✅' : '❌', r[0]);
      });

      const el = document.getElementById('tests');
      if (el) el.textContent = `Tests internos: ${passed}/${results.length} pasaron`;
    }

    // ---------- BOOT ----------
    function boot() {
      // Wait for DOM (already in DOMContentLoaded but safe)
      try {
        // Deep link support: /jugos redirects here with ?cat=Jugos so a QR code
        // can open the app pre-filtered to a specific category.
        const catParam = new URLSearchParams(location.search).get('cat');
        if (catParam) activeCategory = catParam;

        initFirebase();
        setupUI();
        loadCart();
        updateCartBar();

        if (catParam) {
          setTimeout(() => {
            const grid = document.getElementById('productsGrid');
            if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 300);
        }

        // If products load fast the tests will run inside the snapshot handler
        // Fallback: run tests after a short delay in case snapshot is cached/empty
        setTimeout(() => {
          if (!testsRun && products.length > 0) {
            runInternalTests();
            testsRun = true;
          }
        }, 1800);

        // Safety: verify critical elements exist
        ['productsGrid','search','categories','cartBar','adminBtn'].forEach(id => {
          if (!document.getElementById(id)) console.warn('[Fresko] Missing element:', id);
        });

        console.log('%c[Fresko] App lista. Catálogo base: 58+ productos, Banana primero.', 'color:#2f9e44');
      } catch (e) {
        console.error('[Fresko] boot error', e);
        document.body.insertAdjacentHTML('beforeend', '<div style="padding:20px;color:red;">Error crítico al iniciar la app. Revisa la consola.</div>');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
